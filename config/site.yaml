# Alpine site config. Every number carries a source. "assumption - verify" means exactly that.
# Constants retyped from the HeatOS Lansing site config (engine/sites/lansing.yaml), which cites the
# NYU/Grundfos/HDR challenge spec for most of them.

site:
  id: lansing
  name: Lake Hawkeye, Lansing, NY
  lat: 42.6025
  lon: -76.6338
  timezone: America/New_York

data_center:
  it_load_mw: 100.0                 # phase 1, AI inference; source: supply model (data/supply.csv)
  liquid_cooled: true
  supply_temp_c: 55.0               # liquid cooling supply 45-65 C; midpoint
  capture_fraction: 0.75            # direct-to-chip capture; range 0.65-0.80; source: HeatOS supply model
  pue_base: 1.15                    # liquid-cooled; assumption - verify

cooling:
  chiller_cop: 5.0                  # challenge spec
  dry_cooler_capacity_mw: 60.0      # thermal; assumption - verify (sized ~0.8 x mean heat)
  dry_cooler_kw_per_mw_th: 20.0     # fan power per MW rejected; assumption - verify
  tower_kw_per_mw_th: 10.0          # fan + pump power per MW rejected; assumption - verify
  water_gal_per_kwh: 2.0            # evaporative cooling water per kWh of cooling electricity; challenge spec

heat_network:
  supply_temp_c: 70.0               # 4th-gen hot water network; HeatOS methodology
  pipe_loss_per_km: 0.01            # challenge spec default 1%/km
  route_km: 6.0                     # mean route to 15 km-radius customers; assumption - verify
  heat_pump_carnot_fraction: 0.6    # challenge spec
  pump_kw_per_mw_th: 8.0            # network pumping; assumption - verify
  heat_price_usd_per_mwh: 60.0      # what buildings pay vs. gas at $40/MWh fuel + boiler loss; assumption - verify

storage:
  type: pit
  capacity_mwh: 2800.0              # ~60,000 m3 pit at 40 K delta-T; assumption - verify
  max_charge_mw: 10.0               # assumption - verify
  max_discharge_mw: 10.0            # assumption - verify
  loss_per_hour: 0.0001             # assumption - verify
  min_soc: 0.05
  initial_soc: 0.5

prices:
  electricity_usd_per_mwh: 110.0    # challenge spec (upstate NY); range 90-130
  gas_boiler_usd_per_mwh: 40.0      # fuel cost the buildings avoid; assumption - verify
  water_usd_per_kgal: 4.0           # assumption - verify

emissions:
  grid_t_per_mwh: 0.12              # upstate NY grid; range 0.08-0.20; assumption - verify
  gas_boiler_t_per_mwh: 0.181       # challenge spec

scenarios:
  normal: {}
  heat_wave:     {start_hour: 4500, hours: 120, demand_x: 0.3, ambient_plus_c: 10}
  cold_snap:     {start_hour: 400,  hours: 72,  demand_x: 1.4}
  server_outage: {start_hour: 2000, hours: 6,   supply_x: 0.0}
